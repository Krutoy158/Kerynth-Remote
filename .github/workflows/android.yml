name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Agent and Console APKs
        run: gradle :receiver:assembleDebug :console:assembleDebug

      - name: Upload Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: Kerynth-Remote-Agent-debug
          path: receiver/build/outputs/apk/debug/receiver-debug.apk

      - name: Upload Console APK
        uses: actions/upload-artifact@v4
        with:
          name: Kerynth-Remote-Console-debug
          path: console/build/outputs/apk/debug/console-debug.apk
